name: Build Zokii PS4 Chat PRX

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build curl unzip tar

      - name: Download OpenOrbis toolchain
        run: |
          curl -fL -o toolchain.zip             https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.3/toolchain-llvm-18.2.zip
          unzip -q toolchain.zip
          tar -xzf toolchain-llvm-18.tar.gz
          echo "OO_PS4_TOOLCHAIN=$GITHUB_WORKSPACE/OpenOrbis/PS4Toolchain" >> "$GITHUB_ENV"

      - name: Check source
        run: |
          test -f src/chat.cpp
          test -f include/chat.h
          echo "Source files found."

      - name: Build source
        run: |
          mkdir -p build
          clang++ --version
          "$OO_PS4_TOOLCHAIN/bin/clang++"             --target=x86_64-scei-ps4             -fPIC -c src/chat.cpp             -Iinclude             -o build/chat.o

      - name: Build PRX
        run: |
          mkdir -p dist
          if [ -x "$OO_PS4_TOOLCHAIN/bin/create-lib" ]; then
            "$OO_PS4_TOOLCHAIN/bin/create-lib"               build/chat.o               dist/zokii_chat.prx
          else
            echo "::error::create-lib was not found in this toolchain release."
            echo "The source compiled, but the PRX conversion step needs the matching OpenOrbis create-lib tool."
            exit 1
          fi

      - name: Upload PRX
        uses: actions/upload-artifact@v4
        with:
          name: Zokii-PS4-Chat-PRX
          path: dist/zokii_chat.prx
